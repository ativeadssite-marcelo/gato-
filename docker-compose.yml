services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gato
      POSTGRES_PASSWORD: gato
      POSTGRES_DB: gato
    ports:
      - "5432:5432"
    volumes:
      - gato_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  gato_pg:
